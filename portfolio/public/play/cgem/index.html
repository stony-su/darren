<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>cGEM hero</title>
    <script src="/play/_stage/bridge.js"></script>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0a1420;
      }
      .hero {
        position: fixed;
        inset: 0;
        cursor: ew-resize;
        touch-action: none;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      .scale {
        position: fixed;
        left: 50%;
        bottom: 22px;
        display: flex;
        gap: 2.6em;
        transform: translateX(-50%);
        white-space: nowrap;
        pointer-events: none;
        font: 500 11px/1 ui-monospace, Consolas, monospace;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #4f6a82;
      }
      .scale .on {
        color: #a9bfce;
      }
    </style>
  </head>
  <body>
    <div class="hero" id="hero"><canvas id="helix-canvas" aria-label="Particles folding between a DNA helix, a plasmid map and a maple leaf"></canvas></div>
    <div class="scale" aria-hidden="true">
      <span>DNA helix</span>
      <span>Plasmid map</span>
      <span>Maple leaf</span>
    </div>
    <script src="hero.js"></script>
    <script src="host.js"></script>
  </body>
</html>
